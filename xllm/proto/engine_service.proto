syntax = "proto3";

import "tensor.proto";
import "worker.proto";

option go_package = "jd.com/jd-infer/xllm;xllm";
package xllm.proto;
option cc_enable_arenas = true;
option cc_generic_services = true;

message NodePayload {
  map<string, PayloadValue> fields = 1;
}

message PayloadValue {
  oneof kind {
    string string_value = 1;
    Tensor tensor_value = 2;
    MMData mm_data_value = 3;
    IntList int_list_value = 4;
    bytes bytes_value = 5;
  }
}

message IntList {
  repeated int32 values = 1;
}

message RequestContext {
  string request_id = 1;
  int64 deadline_ms = 2;
  string result_target = 3;
  optional RequestSamplingParam sampling_params = 4;
  optional DiTGenerationParams dit_generation_params = 5;
}

message NodeData {
  RequestContext context = 1;
  string source_node = 2;
  string target_node = 3;
  NodePayload payload = 4;
}

enum NodeStatusCode {
  NODE_STATUS_CODE_UNSPECIFIED = 0;
  NODE_STATUS_CODE_OK = 1;
  reserved 2;
  NODE_STATUS_CODE_EXECUTION_FAILED = 3;
  NODE_STATUS_CODE_TIMEOUT = 4;
  NODE_STATUS_CODE_DOWNSTREAM_FAILED = 5;
  NODE_STATUS_CODE_INTERNAL_ERROR = 6;
}

message NodeStatus {
  NodeStatusCode code = 1;
  string message = 2;
}

message NodeResult {
  RequestContext context = 1;
  string node_name = 2;
  NodeStatus status = 3;
  NodePayload payload = 4;
}

message Ack {
  bool ok = 1;
  string error_message = 2;
}

service EngineService {
  rpc Submit(NodeData) returns (Ack);
}

service EnsembleResultService {
  rpc Report(NodeResult) returns (Ack);
}
